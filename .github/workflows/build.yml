name: Build Sit and Watch

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and extract the source ZIP from the repository root
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t archives < <(
            find "$GITHUB_WORKSPACE" -maxdepth 1 -type f \
              -iname 'sitandwatch-mod-source*.zip' -print | sort -V
          )

          if [ "${#archives[@]}" -eq 0 ]; then
            mapfile -t archives < <(
              find "$GITHUB_WORKSPACE" -maxdepth 1 -type f -iname '*.zip' -print | sort -V
            )
          fi

          if [ "${#archives[@]}" -gt 0 ]; then
            archive="${archives[${#archives[@]}-1]}"
            echo "Using source archive: $archive"
            extract_dir="$RUNNER_TEMP/sitandwatch-source"
            rm -rf "$extract_dir"
            mkdir -p "$extract_dir"
            unzip -q -o "$archive" -d "$extract_dir"

            build_file="$(find "$extract_dir" -type f -name build.gradle -print -quit)"
            if [ -z "$build_file" ]; then
              echo "ERROR: The ZIP does not contain build.gradle." >&2
              exit 1
            fi
            project_root="$(dirname "$build_file")"
          elif [ -f "$GITHUB_WORKSPACE/build.gradle" ]; then
            project_root="$GITHUB_WORKSPACE"
          else
            echo "ERROR: No source ZIP or root build.gradle was found." >&2
            exit 1
          fi

          if [ ! -d "$project_root/src/main/java" ]; then
            echo "ERROR: The selected project has no src/main/java directory." >&2
            exit 1
          fi

          echo "Project root: $project_root"
          echo "PROJECT_DIR=$project_root" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.1.1
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.1.1'

      - name: Build mod
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle build --no-daemon

      - name: Rename the built JAR
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$PROJECT_DIR/build/release"
          mapfile -t jars < <(
            find "$PROJECT_DIR/build/libs" -maxdepth 1 -type f -name '*.jar' \
              ! -iname '*sources*.jar' ! -iname '*-dev.jar' | sort
          )
          if [ "${#jars[@]}" -eq 0 ]; then
            echo "ERROR: Gradle completed but no mod JAR was produced." >&2
            exit 1
          fi
          cp "${jars[0]}" "$PROJECT_DIR/build/release/Sit-and-watch.jar"
          ls -lh "$PROJECT_DIR/build/release/Sit-and-watch.jar"

      - name: Upload Sit-and-watch.jar
        uses: actions/upload-artifact@v4
        with:
          name: Sit-and-watch.jar
          path: ${{ env.PROJECT_DIR }}/build/release/Sit-and-watch.jar
          if-no-files-found: error
